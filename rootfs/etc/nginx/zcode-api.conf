# OpenAI-compatible API (zcode-api), included into each Selkies server block ahead of its
# catch-all `location /api` (Selkies owns /api/websockets, /api/files, ...; /api/v1/ is free).
location /api/v1/ {
    proxy_set_header        Host $host;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version      1.1;
    proxy_buffering         off;     # stream SSE tokens as they arrive
    proxy_request_buffering off;
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;
    client_max_body_size    50M;     # base64 images in messages
    proxy_pass              http://127.0.0.1:8091;
}
